apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-uptime-kuma
  namespace: monitoring
spec:
  secretName: tls-uptime-kuma
  commonName: uptimekuma.int.bollingnet.net
  dnsNames:
    - uptimekuma.int.bollingnet.net
  issuerRef:
    name: cloudflare-dns-cluster-issuer # This should match the name of the ClusterIssuer defined in cluster-issuer.yaml
    kind: ClusterIssuer